<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<title>Gym Buddy</title>
<style>
  /* One column, phone first. One question per screen, with the answer on top. */
  :root {
    --bg: #0B0B0C; --card: #1C1C1E; --chip: #2A2A2D; --line: #2A2A2D;
    --text: #F5F5F7; --muted: #9A9AA0;
    --good: #7CFF6B; --wait: #FFC233; --effort: #FF8A4C; --effort-bg: #4A2A18; --effort-text: #FFB48A;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
         -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 480px; margin: 0 auto; min-height: 100vh;
          padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
                   max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
          display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 32px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; text-align: right; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
  .dot.stale { background: var(--wait); }
  .dot.down { background: var(--effort); }
  .hero { font-size: 64px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .hero small { font-size: 18px; font-weight: 400; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
  .muted { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .card h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  .chip { min-width: 48px; min-height: 44px; padding: 0 12px; border-radius: 10px; background: var(--chip);
          font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .chip.unknown { color: var(--muted); }
  .chip:active { transform: scale(0.97); }
  .link { background: none; padding: 10px 0; min-height: 44px; color: var(--muted); font-size: 15px; text-align: left; }
  .day { display: flex; justify-content: space-between; align-items: center; width: 100%; background: none;
         padding: 12px 0; min-height: 44px; border-top: 1px solid var(--line); font-size: 15px; }
  .day span:last-child { color: var(--muted); font-size: 14px; }
  .bars { display: flex; align-items: flex-end; gap: 8px; height: 120px; }
  .bar { flex: 1; border-radius: 5px 5px 0 0; min-height: 4px; background: var(--good); }
  .scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  select { font: inherit; color: var(--text); background: var(--chip); border: 0; border-radius: 10px;
           padding: 0 12px; min-height: 44px; max-width: 60%; }
  .note { font-size: 13px; color: var(--muted); }
  .note.effort { color: var(--effort-text); }
  .note.good { color: var(--good); }
  .empty { text-align: center; padding: 48px 8px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .empty h2 { font-size: 20px; margin: 8px 0 0; }
  :focus-visible { outline: 2px solid var(--good); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .chip:active { transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Gym Buddy</h1>
    <div class="status" id="status" aria-live="polite"></div>
  </header>
  <main id="view" style="display:flex;flex-direction:column;gap:14px"></main>
</div>

<script>
// The whole dashboard: it reads GET /sets and GET /exercises, and draws two
// screens. Today: what did I just do? One set: how did it go?
const REFRESH_MS = 4000;      // look for newly synced sets this often while the page is visible
const STALE_MIN = 60 * 24;    // the status dot turns amber when the last sync is older than this

let sets = [];                // every set, newest first, as the server returned them
let exercises = [];           // [{name, label}] for the dropdown
let shownDay = null;          // which day is on screen; null = the most recent one
let lastJson = "";            // what was last drawn, so an unchanged refresh doesn't redraw
let serverDown = false;

const view = document.getElementById("view");
const statusEl = document.getElementById("status");

function el(tag, attrs, ...children) {
  // Builds elements with textContent, never innerHTML: nothing from the server can run as markup.
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  for (const child of children) node.append(child);
  return node;
}

function labelOf(name) {
  if (!name) return "No exercise picked";
  const match = exercises.find(e => e.name === name);
  return match ? match.label : name;
}

function receivedAt(set) {
  return new Date(set.received_at.replace(" ", "T") + "Z");   // the server stores UTC
}

function dayKey(set) {
  const d = receivedAt(set);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function dayTitle(key) {
  const today = new Date();
  const todayKey = dayKey({received_at: today.toISOString().slice(0, 19).replace("T", " ")});
  if (key === todayKey) return "Today";
  const [y, m, d] = key.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, {weekday: "long", month: "short", day: "numeric"});
}

function ago(date) {
  const minutes = Math.round((Date.now() - date) / 60000);
  if (minutes < 1) return "just now";
  if (minutes < 60) return minutes + " min ago";
  const hours = Math.round(minutes / 60);
  if (hours < 24) return hours + (hours === 1 ? " hour ago" : " hours ago");
  const days = Math.round(hours / 24);
  return days + (days === 1 ? " day ago" : " days ago");
}

function totalReps(list) {
  return list.reduce((sum, set) => sum + (set.reps || 0), 0);
}

function plural(n, word) {
  return n + " " + word + (n === 1 ? "" : "s");
}

function drawStatus() {
  statusEl.replaceChildren();
  if (serverDown) {
    statusEl.append(el("span", {class: "dot down"}), "Can't reach the server");
  } else if (sets.length) {
    const last = receivedAt(sets[0]);
    const stale = (Date.now() - last) / 60000 > STALE_MIN;
    statusEl.append(el("span", {class: "dot" + (stale ? " stale" : "")}), "Synced " + ago(last));
  }
}

function drawToday() {
  if (!sets.length) {
    view.replaceChildren(el("div", {class: "empty"},
      el("h2", {}, "No sets yet"),
      el("div", {class: "muted"}, "Record a set on your watch, then hold B to sync.")));
    return;
  }
  const days = [];                              // [[key, sets]], newest day first
  for (const set of sets) {
    const key = dayKey(set);
    if (!days.length || days[days.length - 1][0] !== key) days.push([key, []]);
    days[days.length - 1][1].push(set);
  }
  const [key, list] = days.find(d => d[0] === shownDay) || days[0];
  const inOrder = [...list].reverse();          // the order they were done
  const groups = [];                            // [[exercise, sets]], in the order first done
  for (const set of inOrder) {
    let group = groups.find(g => g[0] === set.exercise);
    if (!group) groups.push(group = [set.exercise, []]);
    group[1].push(set);
  }

  const nodes = [
    el("div", {},
      el("div", {class: "muted"}, dayTitle(key)),
      el("div", {class: "hero"}, String(totalReps(list)), el("small", {}, "reps")),
      el("div", {class: "muted"}, plural(list.length, "set") + " · " + plural(groups.length, "exercise"))),
  ];
  for (const [exercise, group] of groups) {
    nodes.push(el("section", {class: "card"},
      el("h2", {}, labelOf(exercise)),
      el("div", {class: "chips"}, ...group.map((set, i) =>
        el("button", {class: "chip" + (set.reps === null ? " unknown" : ""),
                      "aria-label": "Set " + (i + 1) + ", " + (set.reps === null ? "not counted" : plural(set.reps, "rep")),
                      onclick: () => { location.hash = "set=" + set.set_id; }},
           set.reps === null ? "?" : String(set.reps))))));
  }
  const others = days.filter(d => d[0] !== key);
  if (others.length) {
    nodes.push(el("div", {},
      el("div", {class: "muted", style: "margin: 8px 0 4px"}, "Other days"),
      ...others.map(([otherKey, otherList]) =>
        el("button", {class: "day", onclick: () => { shownDay = otherKey; draw(true); window.scrollTo(0, 0); }},
           el("span", {}, dayTitle(otherKey)),
           el("span", {}, plural(totalReps(otherList), "rep") + " · " + plural(otherList.length, "set"))))));
  }
  view.replaceChildren(...nodes);
}

function paceCard(set) {
  // Seconds from one rep to the next. Needs at least three reps to say anything.
  const times = set.rep_times || [];
  const gaps = times.slice(1).map((t, i) => t - times[i]);
  if (gaps.length < 2) return null;
  const fastest = Math.min(...gaps), slowest = Math.max(...gaps);
  const bars = gaps.map(gap => {
    const ratio = gap / fastest;
    const color = ratio >= 1.3 ? "var(--effort)" : ratio >= 1.15 ? "var(--wait)" : "var(--good)";
    return el("div", {class: "bar", style: "height:" + Math.round(100 * gap / slowest) + "%;background:" + color,
                      title: gap.toFixed(1) + " s"});
  });
  const slowed = Math.round((gaps[gaps.length - 1] / fastest - 1) * 100);
  const sentence = slowed >= 10
    ? el("div", {class: "note effort"}, "The last rep took " + slowed + "% longer than your fastest.")
    : el("div", {class: "note good"}, "Steady pace all the way through.");
  return el("section", {class: "card"},
    el("div", {class: "muted"}, "Seconds from one rep to the next"),
    el("div", {class: "bars", role: "img",
               "aria-label": "Rep pace: fastest " + fastest.toFixed(1) + " seconds, slowest " + slowest.toFixed(1) + " seconds"},
       ...bars),
    el("div", {class: "scale"}, el("span", {}, "fastest " + fastest.toFixed(1) + " s"),
                                el("span", {}, "slowest " + slowest.toFixed(1) + " s")),
    sentence);
}

function drawSet(setId) {
  const set = sets.find(s => s.set_id === setId);
  if (!set) { location.hash = ""; return; }
  const note = el("div", {class: "note", id: "recount-note", "aria-live": "polite"},
                  "Wrong exercise? Change it and the reps are counted again.");
  const select = el("select", {id: "exercise", "aria-label": "Exercise", onchange: async () => {
    note.className = "note"; note.textContent = "Counting again…";
    try {
      const response = await fetch("/sets/" + set.set_id + "/exercise", {
        method: "PUT", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({exercise: select.value})});
      if (!response.ok) throw new Error(response.status);
      Object.assign(set, await response.json());
      lastJson = "";
      draw(true);
    } catch (error) {
      note.className = "note effort"; note.textContent = "Couldn't change it. Check the connection and try again.";
      select.value = set.exercise || "";
    }
  }});
  if (!set.exercise) select.append(el("option", {value: ""}, "Pick one"));
  for (const e of exercises) select.append(el("option", {value: e.name}, e.label));
  select.value = set.exercise || "";

  const seconds = (set.duration_ms / 1000).toFixed(1);
  const pace = paceCard(set);
  view.replaceChildren(
    el("button", {class: "link", onclick: () => { location.hash = ""; }}, "‹ Back"),
    el("div", {},
      el("div", {class: "muted"}, labelOf(set.exercise)),
      el("div", {class: "hero"}, set.reps === null ? "?" : String(set.reps), el("small", {}, set.reps === 1 ? "rep" : "reps"))),
    ...(set.reps === null ? [el("div", {class: "note effort"}, "This set couldn't be counted. Its recording is saved.")] : []),
    ...(pace ? [pace] : []),
    el("section", {class: "card"},
      el("div", {class: "row"}, el("label", {for: "exercise"}, "Exercise"), select),
      note),
    el("div", {class: "note"}, seconds + " s long · synced " + ago(receivedAt(set)) + " · set " + set.set_id.slice(0, 5)));
}

function draw(force) {
  const json = JSON.stringify(sets) + location.hash + shownDay + serverDown;
  drawStatus();
  if (!force && json === lastJson) return;      // nothing new: leave the screen alone
  lastJson = json;
  const match = location.hash.match(/^#set=(.+)$/);
  if (match) drawSet(match[1]); else drawToday();
}

async function refresh() {
  try {
    const [setsResponse, exercisesResponse] = await Promise.all([
      fetch("/sets"), exercises.length ? null : fetch("/exercises")]);
    if (!setsResponse.ok) throw new Error(setsResponse.status);
    sets = await setsResponse.json();
    if (exercisesResponse && exercisesResponse.ok) exercises = await exercisesResponse.json();
    serverDown = false;
  } catch (error) {
    serverDown = true;                          // keep showing what we have
  }
  draw(false);
}

window.addEventListener("hashchange", () => { draw(true); window.scrollTo(0, 0); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
setInterval(() => { if (!document.hidden && document.activeElement.tagName !== "SELECT") refresh(); }, REFRESH_MS);
refresh();
</script>
</body>
</html>
