<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<title>Gym Buddy</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='8'/%3E%3Crect x='5.5' y='8' width='7' height='9' rx='3' fill='%237CFF6B'/%3E%3Crect x='15.5' y='8' width='7' height='9' rx='3' fill='%237CFF6B'/%3E%3Cpath d='M11 20.5q3 2.2 6 0' stroke='%237CFF6B' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<!-- "Add to Home Screen" on a phone: its own icon, and it opens full screen like an app, without the browser's bars. -->
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Buddy">
<style>
  /* Phone first. One question per screen, with the answer on top.
     Colours mean the same as on the watch: green = good, amber = needs a look, orange = effort or trouble.
     A colour never stands alone: there is always a word, a number or an icon next to it.

     Every colour and size is a named value (a "custom property") defined once here.
     The dark theme is the default; the light theme further down only swaps the values. */
  :root {
    --bg: #0B0B0C; --card: #1C1C1E; --raised: #2A2A2D; --raised-2: #36363A; --line: rgba(255, 255, 255, 0.09);
    --text: #F5F5F7; --muted: #A3A3AB;
    --good: #7CFF6B; --good-text: #7CFF6B; --good-bg: #17301A; --on-good: #0B0B0C;
    --wait: #FFC233; --wait-text: #FFC233; --wait-bg: #382C0E; --on-wait: #0B0B0C;
    --effort: #FF8A4C; --effort-text: #FFB48A; --effort-bg: #45281A; --on-effort: #0B0B0C;
    --hero-glow: rgba(124, 255, 107, 0.11); --bar-dim: 0.8; --bar-bg: rgba(11, 11, 12, 0.78);
    --card-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    --watch-body: #3A3A3F; --watch-strap: #2C2C30; --focus: #7CFF6B;
    --r-card: 22px; --r-chip: 14px; --gap: 16px;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #F2F2F7; --card: #FFFFFF; --raised: #EFEFF4; --raised-2: #E3E3EA; --line: rgba(0, 0, 0, 0.09);
      --text: #1C1C1E; --muted: #5C5C66;
      /* The watch's bright green is unreadable on white, so the light theme uses darker shades of the same three colours. */
      --good: #1E9E3A; --good-text: #17722A; --good-bg: #E2F5E5; --on-good: #FFFFFF;
      --wait: #B77700; --wait-text: #835400; --wait-bg: #FFF0C7; --on-wait: #FFFFFF;
      --effort: #D9541A; --effort-text: #A63C0A; --effort-bg: #FFE5D6; --on-effort: #FFFFFF;
      --hero-glow: rgba(30, 158, 58, 0.10); --bar-dim: 0.9; --bar-bg: rgba(250, 250, 252, 0.82);
      --card-shadow: 0 0 0 1px rgba(0, 0, 0, 0.03), 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.05);
      --watch-body: #2A2A2E; --watch-strap: #C4C4CC; --focus: #17722A;
      color-scheme: light;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, system-ui, sans-serif;
         -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; background: none; padding: 0; }
  h1, h2, p { margin: 0; }
  svg { display: block; flex: none; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .num { font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", Roboto, system-ui, sans-serif;
         font-variant-numeric: tabular-nums; }

  /* The page frame: header, the screen itself, and the bar at the bottom. */
  .app { max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
         padding: max(8px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
                  calc(88px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
         display: flex; flex-direction: column; gap: 8px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; }
  .status { min-height: 44px; display: flex; align-items: center; border-radius: 22px; min-width: 0; }
  .pill { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 12px 0 10px; border-radius: 16px;
          background: var(--card); box-shadow: var(--card-shadow); font-size: 13px; color: var(--muted); white-space: nowrap;
          overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
  .dot.warn { background: var(--wait); }
  .dot.fail { background: var(--effort); }
  .banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px;
            background: var(--effort-bg); color: var(--text); font-size: 14px; }
  .banner svg { color: var(--effort-text); }
  .view { display: flex; flex-direction: column; gap: var(--gap); }
  .cols, .stack, .list { display: grid; gap: var(--gap); grid-template-columns: minmax(0, 1fr); align-content: start; }

  /* Small building blocks used on every screen. */
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.01em; }
  .muted { color: var(--muted); font-size: 14px; }
  .note { font-size: 14px; color: var(--muted); }
  .note.effort { color: var(--effort-text); }
  .foot { font-size: 13px; color: var(--muted); padding: 0 4px; display: flex; gap: 8px; align-items: flex-start; }
  .foot svg { margin-top: 1px; }
  .card { background: var(--card); border-radius: var(--r-card); padding: 16px; box-shadow: var(--card-shadow);
          display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .card h2 { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
  .card-head .muted { font-size: 13px; text-align: right; }

  /* The big number at the top of Today and of a set. */
  .hero { background: radial-gradient(120% 130% at 0% 0%, var(--hero-glow), transparent 62%), var(--card); padding: 20px; gap: 16px; }
  .big { display: flex; align-items: baseline; gap: 8px; line-height: 0.95; }
  .big .num { font-size: 88px; font-weight: 700; letter-spacing: -0.035em; }
  .big .unit { font-size: 20px; font-weight: 500; color: var(--muted); }
  .stats { display: flex; border-top: 1px solid var(--line); padding-top: 14px; }
  .stat { flex: 1; display: flex; flex-direction: column; gap: 2px; padding-left: 14px; border-left: 1px solid var(--line); min-width: 0; }
  .stat:first-child { padding-left: 0; border-left: 0; }
  .stat .v { font-size: 20px; font-weight: 650; line-height: 1.2; white-space: nowrap; }
  .stat .v small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 3px; }
  .stat .l { font-size: 12px; color: var(--muted); }

  /* One tappable square per set: the reps on top, which set it was underneath. */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { position: relative; min-width: 58px; min-height: 60px; padding: 8px 10px 7px; border-radius: var(--r-chip); background: var(--raised);
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
          transition: transform 0.15s var(--ease), background-color 0.15s; }
  .chip .n { font-size: 22px; font-weight: 650; line-height: 1; }
  .chip .k { font-size: 11px; font-weight: 500; color: var(--muted); line-height: 1.2; white-space: nowrap; }
  .chip.unknown .n, .chip.none .n { color: var(--muted); }
  .chip.none { background: none; box-shadow: inset 0 0 0 1.5px var(--raised-2); }
  .chip.slowed { background: var(--effort-bg); }
  .chip.slowed .n, .chip.slowed .k { color: var(--effort-text); }
  .chip .flag { position: absolute; top: 5px; right: 5px; color: var(--effort-text); }
  .chip:active, .rowlink:active, .back:active { transform: scale(0.96); }
  @media (hover: hover) {
    .chip:not(.slowed):hover { background: var(--raised-2); }
    .rowlink:hover, .back:hover { background: var(--raised); }
    nav button:hover { color: var(--text); }
  }

  /* A sentence that deserves attention: an icon in a circle, then the words. */
  .callout { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--raised);
             font-size: 14px; line-height: 1.35; }
  .callout .ci { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none;
                 background: var(--raised-2); color: var(--muted); }
  .callout.good { background: var(--good-bg); }
  .callout.good .ci { background: var(--good); color: var(--on-good); }
  .callout.effort { background: var(--effort-bg); }
  .callout.effort .ci { background: var(--effort); color: var(--on-effort); }

  /* A list of tappable rows inside a card (other workouts, set details, watch checks). */
  .rows { padding: 4px 6px; gap: 0; }
  .rowlink { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 56px;
             padding: 8px 6px 8px 10px; border-radius: 12px; text-align: left; font-size: 15px;
             transition: transform 0.15s var(--ease), background-color 0.15s; }
  .rowlink { position: relative; }
  .rowlink + .rowlink::before { content: ""; position: absolute; left: 10px; right: 6px; top: 0; border-top: 1px solid var(--line); }
  .rowlink .sub { display: block; color: var(--muted); font-size: 13px; }
  .rowlink svg { color: var(--muted); }
  .kv { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 12px 10px; font-size: 15px; }
  .kv + .kv { border-top: 1px solid var(--line); }
  .kv > span:first-child { color: var(--muted); }
  .kv > span:last-child { text-align: right; }
  .kv .sub { display: block; color: var(--muted); font-size: 13px; }
  .back { align-self: flex-start; display: flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 14px 0 6px; margin: -4px 0 -4px -6px;
          border-radius: 22px; font-size: 16px; font-weight: 500; color: var(--muted);
          transition: transform 0.15s var(--ease), background-color 0.15s; }

  /* The pace chart. Each bar is one gap between reps; the dashed line is the set's usual pace. */
  .chart { display: flex; flex-direction: column; gap: 6px; }
  .plot { position: relative; height: 150px; margin-top: 22px; display: flex; gap: 6px; border-bottom: 1px solid var(--line); }
  .col { position: relative; flex: 1; min-width: 0; height: 100%; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; width: 100%; max-width: 44px; min-height: 4px;
         border-radius: 7px 7px 0 0; background: var(--good); opacity: var(--bar-dim); transform-origin: bottom; }
  .bar.slow { background: var(--wait); }
  .bar.slower { background: var(--effort); }
  .val { position: absolute; left: -8px; right: -8px; text-align: center; font-size: 12px; color: var(--muted);
         font-variant-numeric: tabular-nums; margin-bottom: 4px; z-index: 1; }
  .val span { background: var(--card); border-radius: 4px; padding: 0 3px; }   /* so the dashed line never runs through a number */
  .col.last .bar { opacity: 1; }
  .col.last .val { color: var(--text); font-weight: 700; font-size: 13px; }
  .ref { position: absolute; left: 0; right: 0; height: 0; border-top: 2px dashed var(--text); opacity: 0.5; pointer-events: none; }
  .axis { display: flex; gap: 6px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .axis span { flex: 1; min-width: 0; text-align: center; white-space: nowrap; }
  .axis .last { color: var(--text); font-weight: 700; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); padding-top: 6px; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--good); flex: none; }
  .legend i.slow { background: var(--wait); }
  .legend i.slower { background: var(--effort); }
  .legend i.dash { width: 16px; height: 0; border-radius: 0; background: none; border-top: 2px dashed var(--text); opacity: 0.5; }

  /* The exercise picker. The browser's own arrow is hidden and ours is drawn on top, so it looks the same everywhere. */
  .field { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .field label { font-size: 15px; font-weight: 600; }
  .pick { position: relative; max-width: 65%; }
  .pick select { font: inherit; font-size: 15px; color: var(--text); background: var(--raised); border: 0; border-radius: 12px;
                 padding: 0 36px 0 14px; min-height: 44px; max-width: 100%; appearance: none; -webkit-appearance: none; cursor: pointer; }
  .pick svg { position: absolute; right: 10px; top: 50%; margin-top: -9px; color: var(--muted); pointer-events: none; }

  /* Watch screen: the buddy, a strip with one segment per check, then the checks. */
  .buddy-card { flex-direction: row; align-items: center; gap: 16px; padding: 20px; }
  .buddy-card .title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
  .buddy-card .words { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
  .meter { display: flex; gap: 4px; margin-top: 6px; }
  .meter i { flex: 1; height: 6px; border-radius: 3px; background: var(--good); max-width: 28px; }
  .meter i.warn { background: var(--wait); }
  .meter i.fail { background: var(--effort); }
  .check { display: flex; gap: 12px; align-items: flex-start; padding: 13px 10px; }
  .check + .check { border-top: 1px solid var(--line); }
  .mark { width: 24px; height: 24px; border-radius: 50%; flex: none; display: grid; place-items: center;
          background: var(--good); color: var(--on-good); margin-top: -1px; }
  .mark.warn { background: var(--wait); color: var(--on-wait); }
  .mark.fail { background: var(--effort); color: var(--on-effort); }
  .check .body { flex: 1; min-width: 0; font-size: 15px; display: flex; flex-direction: column; gap: 2px; }
  .check .help { font-size: 14px; color: var(--muted); }
  .check .help.warn { color: var(--wait-text); }
  .check .help.fail { color: var(--effort-text); }
  .check .value { color: var(--muted); font-size: 14px; text-align: right; flex: none; max-width: 50%; font-variant-numeric: tabular-nums; }

  /* Nothing to show yet, or the server is out of reach. */
  .empty { text-align: center; padding: 40px 12px 8px; display: flex; flex-direction: column; gap: 10px; align-items: center;
           width: 100%; max-width: 420px; margin: 0 auto; }
  .empty h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin-top: 12px; }
  .empty p { color: var(--muted); font-size: 15px; max-width: 32ch; }
  .steps { align-self: stretch; text-align: left; margin-top: 16px; padding: 6px 16px; gap: 0; }
  .step { display: flex; align-items: center; gap: 12px; padding: 12px 0; font-size: 15px; }
  .step + .step { border-top: 1px solid var(--line); }
  .step .n { width: 26px; height: 26px; border-radius: 50%; background: var(--raised); color: var(--muted); display: grid; place-items: center;
             font-size: 13px; font-weight: 700; flex: none; }
  .btn { min-height: 44px; padding: 0 20px; border-radius: 22px; background: var(--raised); font-weight: 600; font-size: 15px; margin-top: 8px; }

  /* The buddy: the watch's own face. It blinks now and then, like the real one. */
  .buddy .strap { fill: var(--watch-strap); }
  .buddy .body { fill: var(--watch-body); }
  .buddy .blink { transform-box: fill-box; transform-origin: center; animation: blink 6s 1.5s infinite; }
  @keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97.5% { transform: scaleY(0.12); } }

  /* Grey shapes that stand in for the screen while the first answer is on its way. */
  .sk { border-radius: 10px; background: var(--raised); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.45; } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* The bar at the bottom of a phone. On a wide screen it becomes a rail on the left (see below). */
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; background: var(--bar-bg); border-top: 1px solid var(--line);
        -webkit-backdrop-filter: saturate(1.6) blur(20px); backdrop-filter: saturate(1.6) blur(20px);
        padding: 0 max(8px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(8px, env(safe-area-inset-left)); }
  nav div { max-width: 420px; margin: 0 auto; display: flex; }
  nav button { flex: 1; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
               color: var(--muted); font-size: 12px; font-weight: 500; border-radius: 16px; transition: color 0.15s; }
  nav .ico { display: grid; place-items: center; width: 60px; height: 30px; border-radius: 15px; transition: background-color 0.2s; }
  nav button[aria-current="page"] { color: var(--text); font-weight: 700; }
  nav button[aria-current="page"] .ico { background: var(--good-bg); color: var(--good-text); }
  nav button:focus-visible { outline-offset: -4px; }

  /* Motion. Things ease in once when a screen opens: the view gets the class "enter" only then,
     so the 4-second refresh never replays any of it. */
  .view.enter [data-rise] { animation: rise 0.5s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
  .view.enter .chip { animation: pop 0.4s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms + var(--c, 0) * 35ms + 120ms); }
  .view.enter .bar { animation: grow 0.6s var(--ease) both; animation-delay: calc(var(--c, 0) * 45ms + 180ms); }
  .view.enter .val { animation: fade 0.4s ease both; animation-delay: calc(var(--c, 0) * 45ms + 480ms); }
  .view.enter .ref { animation: sweep 0.5s var(--ease) 0.5s both; transform-origin: left; }
  .view.enter .meter i { animation: pop 0.35s var(--ease) both; animation-delay: calc(var(--c, 0) * 50ms + 200ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @keyframes pop { from { opacity: 0; transform: scale(0.85); } }
  @keyframes grow { from { transform: scaleY(0); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes sweep { from { transform: scaleX(0); opacity: 0; } }
  /* Some people get dizzy from movement and say so in their system settings. For them, nothing moves. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .chip:active, .rowlink:active, .back:active { transform: none; }
  }

  /* Tablet: a little more room, and the exercise cards sit two across. */
  @media (min-width: 640px) {
    .app { max-width: 760px; padding-left: 24px; padding-right: 24px; }
    .list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .list > .foot { grid-column: 1 / -1; }
  }
  /* Laptop: the bottom bar becomes a rail on the left, holding the name, the two sections and the watch status. */
  @media (min-width: 900px) {
    body { padding-left: 232px; }
    .app { max-width: 1180px; padding: 32px 40px 40px; }
    .top { min-height: 0; height: 0; }
    .brand { position: fixed; left: 24px; top: 28px; z-index: 3; font-size: 18px; }
    .status { position: fixed; left: 12px; bottom: 16px; width: 208px; z-index: 3; }
    .status .pill { width: 100%; min-height: 40px; border-radius: 12px; background: var(--raised); box-shadow: none; }
    nav { right: auto; top: 0; width: 232px; border-top: 0; border-right: 1px solid var(--line); background: var(--card);
          -webkit-backdrop-filter: none; backdrop-filter: none; padding: 84px 12px 72px; }
    nav div { flex-direction: column; gap: 4px; max-width: none; }
    nav button { flex: none; flex-direction: row; justify-content: flex-start; gap: 10px; min-height: 48px; padding: 0 8px;
                 font-size: 15px; border-radius: 12px; }
    nav .ico { width: 36px; height: 32px; border-radius: 10px; }
    nav button[aria-current="page"] { background: var(--raised); }
    nav button[aria-current="page"] .ico { background: none; }
    nav button:focus-visible { outline-offset: 2px; }
    .big .num { font-size: 104px; }
  }
  /* Wide laptop: two columns, so the screen is used instead of one thin strip down the middle. */
  @media (min-width: 1120px) {
    .cols { gap: 24px; align-items: start; }
    .cols.today { grid-template-columns: minmax(340px, 400px) minmax(0, 1fr); grid-template-rows: auto 1fr; }
    .cols.today > .a { grid-column: 1; grid-row: 1; }
    .cols.today > .b { grid-column: 2; grid-row: 1 / span 2; }
    .cols.today > .c { grid-column: 1; grid-row: 2; }
    .cols.set { grid-template-columns: minmax(0, 1fr) minmax(320px, 380px); }
    .cols.watch { grid-template-columns: minmax(340px, 400px) minmax(0, 1fr); }
    .cols.watch .buddy-card { flex-direction: column; align-items: flex-start; padding: 28px 24px; gap: 20px; }
    .plot { height: 220px; }
    .bar { max-width: 64px; }
  }

  /* ---- things the wearer can change: the count, the weight, removing a set ---- */
  .chip.new { box-shadow: inset 0 0 0 2px var(--good); animation: arrive 1.6s var(--ease) 2; }
  .chip .tag { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); background: var(--good); color: var(--on-good);
               font-size: 10px; font-weight: 700; line-height: 1; padding: 3px 7px; border-radius: 8px; letter-spacing: 0.02em; }
  @keyframes arrive { 0%, 100% { transform: scale(1); } 30% { transform: scale(1.12); } }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button { width: 44px; height: 44px; border-radius: 50%; background: var(--raised); font-size: 24px; line-height: 1; font-weight: 500; }
  .stepper button:active { transform: scale(0.94); }
  .stepper .now { min-width: 48px; text-align: center; font-size: 24px; font-weight: 650; }
  .weight { display: flex; align-items: center; gap: 8px; }
  .weight input { width: 92px; min-height: 44px; border-radius: 12px; border: 0; background: var(--raised); color: var(--text);
                  font: inherit; font-size: 17px; font-weight: 600; text-align: right; padding: 0 12px; }
  .weight input::placeholder { color: var(--muted); font-weight: 400; }
  .field label, .field .lab { font-weight: 600; }
  .linkbtn { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; min-height: 44px; font-size: 14px; text-align: left; }
  .offer { align-self: flex-start; min-height: 44px; padding: 0 16px; border-radius: 22px; background: var(--good-bg); color: var(--good-text);
           font-weight: 600; font-size: 15px; }
  .danger { width: 100%; min-height: 48px; border-radius: var(--r-card); background: var(--card); color: var(--effort-text);
            font-weight: 600; box-shadow: var(--card-shadow); }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom)); z-index: 30;
           display: flex; align-items: center; gap: 14px; max-width: calc(100vw - 32px); padding: 4px 6px 4px 16px; min-height: 48px;
           border-radius: 16px; background: var(--text); color: var(--bg); font-size: 15px; font-weight: 500;
           box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35); animation: toast-in 0.25s var(--ease); }
  .toast[hidden] { display: none; }
  .toast button { min-height: 40px; padding: 0 12px; border-radius: 12px; font-weight: 700; color: inherit; text-decoration: underline; text-underline-offset: 3px; }
  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 12px); } }

  /* ---- the movement chart: what the watch felt, with a numbered mark on each rep it counted ---- */
  .trace { position: relative; height: 150px; margin-top: 18px; color: var(--good); }
  .trace svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .trace .line { fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .trace .area { fill: currentColor; opacity: 0.13; stroke: none; }
  .rep-dot { position: absolute; width: 22px; height: 22px; margin: 0 0 -11px -11px; border-radius: 50%; display: grid; place-items: center;
             background: var(--text); color: var(--card); font-size: 11px; font-weight: 700; line-height: 1;
             box-shadow: 0 0 0 3px var(--card); font-variant-numeric: tabular-nums; }
  .rep-dot.small { width: 10px; height: 10px; margin: 0 0 -5px -5px; box-shadow: 0 0 0 2px var(--card); }
  .view.enter .rep-dot { animation: pop 0.35s var(--ease) both; animation-delay: calc(var(--c, 0) * 60ms + 350ms); }
  .ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 8px; }

  /* ---- the workout as a strip of time: a block for each set, the gaps between are rest ---- */
  .timeline { position: relative; height: 26px; border-radius: 8px; background: var(--raised); overflow: hidden; }
  .timeline i { position: absolute; top: 5px; bottom: 5px; min-width: 4px; border-radius: 3px; background: var(--good); opacity: var(--bar-dim); }
  .timeline i.slowed { background: var(--effort); }
  .view.enter .timeline i { animation: grow-x 0.5s var(--ease) both; animation-delay: calc(var(--c, 0) * 35ms + 250ms); transform-origin: left; }
  @keyframes grow-x { from { transform: scaleX(0); opacity: 0; } }
  .hero .delta { align-self: flex-start; margin-top: -6px; }

  /* ---- the last four weeks as a small calendar: a filled square for each day with a workout ---- */
  .cal { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: center; }
  .weeks { flex: 0 1 300px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .weeks .wd { font-size: 11px; color: var(--muted); text-align: center; padding-bottom: 2px; }
  .day { aspect-ratio: 1; border-radius: 10px; background: var(--raised); display: grid; place-items: center;
         font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; transition: transform 0.15s var(--ease); }
  .day.on { background: var(--good-bg); color: var(--good-text); font-weight: 700; }
  .day.on.big { background: var(--good); color: var(--on-good); }
  .day.today { box-shadow: inset 0 0 0 2px var(--text); }
  .day.later { opacity: 0.35; }
  button.day:active { transform: scale(0.92); }
  .view.enter .day.on { animation: pop 0.35s var(--ease) both; animation-delay: calc(var(--c, 0) * 60ms + 250ms); }
  .cal .words { flex: 1 1 180px; display: flex; flex-direction: column; gap: 4px; }
  .cal .words .n { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .cal .words .n small { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 6px; letter-spacing: 0; }

  /* ---- progress ---- */
  .delta { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 12px; font-size: 13px; font-weight: 600;
           background: var(--raised); color: var(--muted); white-space: nowrap; }
  .delta.up { background: var(--good-bg); color: var(--good-text); }
  .trend-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .trend-top .n { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .trend-top .n small { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 5px; letter-spacing: 0; }
  .plot.small { height: 96px; }
  .bar.past { opacity: 0.45; }
  @media (min-width: 900px) { .toast { bottom: 28px; } }
  @media (prefers-reduced-motion: reduce) { .chip.new, .toast { animation: none; } .stepper button:active { transform: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="brand">
      <svg viewBox="0 0 28 28" width="28" height="28" aria-hidden="true">
        <rect width="28" height="28" rx="8" fill="#000"/>
        <rect x="5.5" y="8" width="7" height="9" rx="3" fill="#7CFF6B"/><rect x="15.5" y="8" width="7" height="9" rx="3" fill="#7CFF6B"/>
        <path d="M11 20.5q3 2.2 6 0" stroke="#7CFF6B" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </svg>
      Gym Buddy
    </h1>
    <button class="status" id="status" hidden><span class="pill" id="status-pill"></span></button>
  </header>
  <div class="banner" id="offline" role="status" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zM12 7.5v5.5M12 16.4v.2"/></svg>
    <span>Can't reach the server. These are the last numbers it sent.</span>
  </div>
  <main id="view" class="view"></main>
</div>
<nav aria-label="Sections"><div>
  <button id="nav-today">
    <span class="ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 6.5v11M17 6.5v11M3.5 9.5v5M20.5 9.5v5M7 12h10"/></svg></span>
    <span>Today</span>
  </button>
  <button id="nav-progress">
    <span class="ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h16M8.5 15.5v-3M13 15.5V9M17.5 15.5V6.5"/></svg></span>
    <span>Progress</span>
  </button>
  <button id="nav-watch">
    <span class="ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="7" width="11" height="10" rx="3"/><path d="M9 7l.6-3.5h4.8L15 7M9 17l.6 3.5h4.8L15 17"/></svg></span>
    <span>Watch</span>
  </button>
</div></nav>
<div class="toast" id="toast" role="status" hidden></div>

<script>
// The whole dashboard. It asks the server for workouts, progress and the watch's health,
// and draws four screens:
//   Today: what did I just do?     One set: how did it go, and is it right?
//   Progress: am I getting stronger?     Watch: is everything working?
// The server does the thinking (counts, pace, suggestions, verdicts); this page only draws.
const REFRESH_MS = 4000;      // look for newly synced sets this often while the page is visible
const SLOWED_PCT = 25;        // a set whose last rep slowed this much is tinted
const NEW_FOR_MS = 120000;    // a set that just arrived is marked "New" for this long
const TOAST_MS = 7000;        // how long a message at the bottom stays up

let workouts = [];            // newest first, as GET /workouts returned them
let health = null;            // GET /watch/health
let locked = true;            // GET /session: false when the server has no password, so there is nothing to sign out of
let exercises = [];           // [{name, label}] for the dropdown
let shown = 0;                // which workout is on screen: 0 = the newest
let openSet = null;           // the set on the detail screen, as GET /sets/{id} returned it
let lastDrawn = "";           // what was last drawn, so an unchanged refresh doesn't redraw
let serverDown = false;
let loaded = false;           // has the server answered at least once?
let lastScene = "";           // which screen was last drawn, so things only ease in when the screen changes
let heroWas = null;           // the big number last shown, so a changed count rolls from the old value
let progress = [];            // GET /progress: each exercise across workouts
let trace = null;             // GET /sets/{id}/trace for the open set: {key, points, reps}, or {key} if it has none
let knownSets = null;         // the set IDs seen so far; null until the first answer, so nothing is "new" on opening the page
const arrived = new Map();    // set ID -> when it first showed up while the page was open

const view = document.getElementById("view");
const statusEl = document.getElementById("status");
const statusPill = document.getElementById("status-pill");
const offlineEl = document.getElementById("offline");
const toastEl = document.getElementById("toast");
const calm = window.matchMedia("(prefers-reduced-motion: reduce)");   // true when the person asked for no motion

function el(tag, attrs, ...children) {
  // Builds elements with text, never innerHTML: nothing from the server can run as markup.
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  for (const child of children) node.append(child);
  return node;
}

const SVG = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, ...children) {
  // The same idea as el(), for drawings. SVG shapes need their own kind of element.
  const node = document.createElementNS(SVG, tag);
  for (const [key, value] of Object.entries(attrs || {})) node.setAttribute(key, value);
  node.append(...children);
  return node;
}

// Each icon is one line drawing on a 24 x 24 grid. The text is fixed here, never from the server.
const ICONS = {
  right: "M9 6l6 6-6 6", left: "M15 6l-6 6 6 6", down: "M6 9l6 6 6-6",
  more: "M12 19V5M6 11l6-6 6 6", less: "M12 5v14M6 13l6 6 6-6", stay: "M6 9h12M6 15h12",
  ok: "M5 12.5l4.5 4.5L19 7.5", warn: "M12 6v7.5M12 17.4v.2", fail: "M7 7l10 10M17 7L7 17",
  slowed: "M3 7l6 6 4-4 8 8M21 12v5h-5",
  info: "M12 3a9 9 0 100 18 9 9 0 000-18zM12 11v5.5M12 7.6v.2",
};
function icon(name, size, width) {
  return svgEl("svg", {viewBox: "0 0 24 24", width: size || 18, height: size || 18, fill: "none", stroke: "currentColor",
                       "stroke-width": width || 2.2, "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true"},
               svgEl("path", {d: ICONS[name]}));
}

function plural(n, word) {
  return n + " " + word + (n === 1 ? "" : "s");
}

function ago(date) {
  const minutes = Math.round((Date.now() - date) / 60000);
  if (minutes < 1) return "just now";
  if (minutes < 60) return minutes + " min ago";
  const hours = Math.round(minutes / 60);
  if (hours < 24) return hours + (hours === 1 ? " hour ago" : " hours ago");
  const days = Math.round(hours / 24);
  return days + (days === 1 ? " day ago" : " days ago");
}

function clockTime(date) {
  // "7:42 PM" for today, "Nov 10, 7:42 PM" for any other day.
  const time = date.toLocaleTimeString(undefined, {hour: "numeric", minute: "2-digit"});
  if (new Date().toDateString() === date.toDateString()) return time;
  return date.toLocaleDateString(undefined, {month: "short", day: "numeric"}) + ", " + time;
}

function workoutTitle(workout) {
  const date = new Date(workout.started_at);
  const today = new Date().toDateString() === date.toDateString();
  const day = today ? "Today" : date.toLocaleDateString(undefined, {weekday: "long", month: "short", day: "numeric"});
  const time = date.toLocaleTimeString(undefined, {hour: "numeric", minute: "2-digit"});
  // Sets recorded before the watch knew the time are dated by when they were uploaded.
  // "uploaded", not "synced": this is when these sets arrived, not when the watch last synced.
  return day + (workout.timed ? ", " + time : ", uploaded " + time);
}

function route() {
  const hash = location.hash;
  if (hash === "#watch") return {screen: "watch"};
  if (hash === "#progress") return {screen: "progress"};
  const match = hash.match(/^#set=(.+)$/);
  return match ? {screen: "set", id: match[1]} : {screen: "today"};
}

function drawStatus() {
  // The pill in the corner, the "can't reach the server" strip, and which section is lit in the bar.
  let dot = "", words = "";
  if (serverDown) { dot = "fail"; words = "Can't reach the server"; }
  else if (health && health.seen) { dot = health.status; words = "Last sync " + ago(new Date(health.received_at)); }
  else if (health) { dot = "warn"; words = "No word from the watch yet"; }
  statusEl.hidden = !words;
  if (words) {
    statusPill.replaceChildren(el("span", {class: "dot " + dot}), words);
    statusEl.setAttribute("aria-label", words + ". Open the watch checks.");
  }
  offlineEl.hidden = !(serverDown && loaded);           // with nothing loaded yet, the screen itself says it
  const screen = route().screen;
  const section = screen === "watch" || screen === "progress" ? screen : "today";      // a set belongs to Today
  for (const [id, on] of [["nav-today", section === "today"], ["nav-progress", section === "progress"], ["nav-watch", section === "watch"]]) {
    const button = document.getElementById(id);
    if (on) button.setAttribute("aria-current", "page"); else button.removeAttribute("aria-current");
  }
}

let toastTimer = 0;
function toast(text, actionLabel, action) {
  // A short message at the bottom that goes away by itself. It can carry one button, such as Undo.
  toastEl.replaceChildren(el("span", {}, text));
  if (actionLabel) toastEl.append(el("button", {onclick: () => { toastEl.hidden = true; action(); }}, actionLabel));
  toastEl.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.hidden = true; }, TOAST_MS);
}

function isNew(setId) {
  return arrived.has(setId) && Date.now() - arrived.get(setId) < NEW_FOR_MS;
}

function pounds(weight) {
  return String(Math.round(weight * 10) / 10) + " lb";
}

async function change(method, path, body) {
  // One change sent to the server (a corrected count, a weight, removing a set). Returns the set as it is now.
  const response = await fetch(path, {method, headers: {"Content-Type": "application/json"},
                                      body: body === undefined ? undefined : JSON.stringify(body)});
  if (response.status === 401) { location.replace("/login"); throw new Error("signed out"); }
  if (!response.ok) throw new Error(path + " " + response.status);
  return response.json();
}

function buddy(status, size) {
  // The watch with its face on it, drawn like the real one: two rounded eyes.
  // Green and smiling when all is well, amber with one eye squinting when something needs a look,
  // orange and worried when something failed. The screen stays black in both themes, like the real screen.
  const color = {ok: "#7CFF6B", warn: "#FFC233", fail: "#FF8A4C"}[status];
  const face = [];
  if (status === "ok") {
    face.push(svgEl("rect", {class: "blink", x: 34, y: 33, width: 19, height: 20, rx: 8, fill: color}),
              svgEl("rect", {class: "blink", x: 67, y: 33, width: 19, height: 20, rx: 8, fill: color}),
              svgEl("path", {d: "M51 62q9 7 18 0", stroke: color, "stroke-width": 3, fill: "none", "stroke-linecap": "round"}));
  } else if (status === "warn") {
    face.push(svgEl("rect", {class: "blink", x: 33, y: 36, width: 20, height: 24, rx: 8, fill: color}),
              svgEl("rect", {x: 67, y: 46, width: 20, height: 9, rx: 4.5, fill: color}));
  } else {
    face.push(svgEl("rect", {x: 31, y: 36, width: 22, height: 26, rx: 7, fill: color}),
              svgEl("rect", {x: 68, y: 44, width: 21, height: 16, rx: 6, fill: color}),
              svgEl("path", {d: "M30 35h24v2L30 45zM67 43h23v9L67 45z", fill: "#000"}));   // the worried slant of the eyelids
  }
  const scale = (size || 96) / 120;
  return svgEl("svg", {class: "buddy", viewBox: "0 0 120 108", width: Math.round(120 * scale), height: Math.round(108 * scale), "aria-hidden": "true"},
    svgEl("rect", {class: "strap", x: 36, y: 0, width: 48, height: 22, rx: 6}),
    svgEl("rect", {class: "strap", x: 36, y: 86, width: 48, height: 22, rx: 6}),
    svgEl("rect", {class: "strap", x: 113, y: 40, width: 5, height: 16, rx: 2.5}),
    svgEl("rect", {class: "body", x: 4, y: 12, width: 112, height: 84, rx: 20}),
    svgEl("rect", {x: 12, y: 20, width: 96, height: 68, rx: 12, fill: "#000"}),
    ...face);
}

function callout(tone, iconName, text) {
  return el("div", {class: "callout" + (tone ? " " + tone : "")}, el("span", {class: "ci"}, icon(iconName, 16, 2.6)), el("div", {}, text));
}

function stat(value, unit, label) {
  return el("div", {class: "stat"},
    el("span", {class: "v num"}, String(value), ...(unit ? [el("small", {}, unit)] : [])),
    el("span", {class: "l"}, label));
}

function bigNumber(value, unit) {
  // The headline number. Screen readers get "92 reps" once, not every step of the count-up.
  const number = el("span", {class: "num", "aria-hidden": "true"}, value === null ? "?" : String(value));
  const node = el("div", {class: "big", role: "img", "aria-label": (value === null ? "Not counted" : plural(value, "rep"))},
                  number, el("span", {class: "unit", "aria-hidden": "true"}, unit));
  return {node, number};
}

function countUp(node, from, to) {
  // Rolls the number up over about half a second, fast at first and slowing at the end.
  if (from === to || calm.matches || document.hidden) return;
  const started = performance.now(), lasts = 650;
  node.textContent = String(from);
  const step = now => {
    if (!node.isConnected) return;
    const t = Math.min(1, (now - started) / lasts);
    node.textContent = String(Math.round(from + (to - from) * (1 - Math.pow(1 - t, 3))));
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  // A phone stops drawing frames when the page goes to the background. Whatever happens, end on the real number.
  setTimeout(() => { if (node.isConnected) node.textContent = String(to); }, lasts + 150);
}

function skeleton(screen) {
  // Grey shapes in the layout of the real screen, shown until the first answer arrives.
  const bone = (width, height) => el("div", {class: "sk", style: "width:" + width + ";height:" + height + "px"});
  const card = (...bones) => el("div", {class: "card"}, ...bones);
  const hero = el("div", {class: "card hero a"}, bone("40%", 14), bone("45%", 76), bone("100%", 40));
  const said = el("span", {class: "sr"}, "Loading");
  if (screen === "watch") {
    return [said, el("div", {class: "cols watch"}, card(bone("70%", 80)), card(bone("100%", 28), bone("100%", 28), bone("100%", 28), bone("100%", 28)))];
  }
  if (screen === "set") {
    return [said, bone("90px", 36), el("div", {class: "cols set"}, el("div", {class: "stack"}, hero, card(bone("30%", 18), bone("100%", 150))),
                                       el("div", {class: "stack"}, card(bone("100%", 44))))];
  }
  return [said, el("div", {class: "cols today"}, hero,
    el("div", {class: "list b"}, ...[0, 1, 2, 3].map(() => card(bone("35%", 18), bone("70%", 60), bone("100%", 44)))))];
}

function drawOffline() {
  view.replaceChildren(el("div", {class: "empty", "data-rise": ""},
    buddy("fail", 132),
    el("h2", {}, "Can't reach the server"),
    el("p", {}, "Check that it is running and that this device is on the same network. Trying again every few seconds."),
    el("button", {class: "btn", onclick: refresh}, "Try again")));
}

function steps(...lines) {
  return el("div", {class: "card steps"}, ...lines.map((line, i) =>
    el("div", {class: "step"}, el("span", {class: "n", "aria-hidden": "true"}, String(i + 1)), el("span", {}, line))));
}

function changeChip(change, than) {
  // "3 more reps than last time", green when it went up. The same chip on Today and on Progress.
  return change > 0 ? el("span", {class: "delta up"}, icon("more", 13, 2.8), plural(change, "more rep") + " than " + than)
       : change < 0 ? el("span", {class: "delta"}, icon("less", 13, 2.8), plural(-change, "fewer rep") + " than " + than)
       : el("span", {class: "delta"}, icon("stay", 13, 2.8), "Same as " + than);
}

function timeline(workout) {
  // The workout laid out along time: a block for each set, as wide as the set was long. The gaps are rest.
  // Only for workouts whose sets know when they happened; uploaded-all-at-once sets would be one pile.
  const sets = workout.exercises.flatMap(e => e.sets).map(s => ({...s, from: new Date(s.at).getTime() / 1000}));
  if (!workout.timed || sets.length < 2) return [];
  sets.sort((a, b) => a.from - b.from);
  const start = sets[0].from, last = sets[sets.length - 1];
  const span = last.from + last.seconds - start;
  if (span <= 0) return [];
  const moving = sets.reduce((sum, s) => sum + s.seconds, 0);
  let longest = 0;
  for (let i = 1; i < sets.length; i++) longest = Math.max(longest, sets[i].from - (sets[i - 1].from + sets[i - 1].seconds));
  const clock = seconds => seconds < 60 ? Math.round(seconds) + " s" : Math.round(seconds / 60) + " min";
  const time = seconds => new Date(seconds * 1000).toLocaleTimeString(undefined, {hour: "numeric", minute: "2-digit"});
  return [el("div", {class: "chart", role: "img",
                     "aria-label": "The workout over time: " + clock(moving) + " of sets, longest rest " + clock(longest)},
    el("div", {class: "timeline"}, ...sets.map((s, i) => {
      const slowed = s.slowdown_pct !== null && s.slowdown_pct >= SLOWED_PCT;
      return el("i", {class: slowed ? "slowed" : "", style: "--c:" + Math.min(i, 14) + ";left:" + (100 * (s.from - start) / span).toFixed(2)
                                                          + "%;width:" + (100 * s.seconds / span).toFixed(2) + "%"});
    })),
    el("div", {class: "ends"}, el("span", {}, time(start)),
       el("span", {}, clock(moving) + " moving · longest rest " + clock(longest)), el("span", {}, time(start + span))))];
}

function drawToday() {
  if (!workouts.length) {
    view.replaceChildren(el("div", {class: "empty", "data-rise": ""},
      buddy("ok", 132),
      el("h2", {}, "No sets yet"),

      steps("Pick an exercise on your watch", "Record a set", "Hold B to sync")));
    return null;
  }
  const workout = workouts[Math.min(shown, workouts.length - 1)];

  const before = workouts[Math.min(shown, workouts.length - 1) + 1];      // the workout before this one, if there is one
  const hero = el("section", {class: "card hero a", "data-rise": ""},
    el("div", {class: "eyebrow"}, workoutTitle(workout)),

    ...(before ? [changeChip(workout.reps - before.reps, "the workout before")] : []),
    el("div", {class: "stats"},
      stat(workout.sets, "", workout.sets === 1 ? "Set" : "Sets"),
      stat(picked, "", picked === 1 ? "Exercise" : "Exercises"),
      ...(workout.timed ? [stat(workout.minutes, "min", "Start to finish")] : [])),
    ...timeline(workout));

  let anySlowed = false;
  const cards = workout.exercises.map(exercise => {
    const reps = exercise.sets.reduce((sum, set) => sum + (set.reps || 0), 0);
    const card = el("section", {class: "card", "data-rise": ""},
      el("div", {class: "card-head"},
        el("h2", {}, exercise.label),
        el("span", {class: "muted"}, plural(exercise.sets.length, "set") + " · " + plural(reps, "rep"))),
      el("div", {class: "chips"}, ...exercise.sets.map((set, i) => {
        const slowed = set.slowdown_pct !== null && set.slowdown_pct >= SLOWED_PCT;
        anySlowed = anySlowed || slowed;
        const fresh = isNew(set.set_id);
        const spoken = (fresh ? "New. " : "") + "Set " + (i + 1) + ", " + (set.reps === null ? "not counted" : plural(set.reps, "rep"))
                     + (set.weight ? ", " + pounds(set.weight) : "") + (slowed ? ", slowed at the end" : "");
        return el("button", {class: "chip" + (set.reps === null ? " unknown" : set.reps === 0 ? " none" : "") + (slowed ? " slowed" : "") + (fresh ? " new" : ""),
                             style: "--c:" + i, "aria-label": spoken, onclick: () => { location.hash = "set=" + set.set_id; }},
                  ...(fresh ? [el("span", {class: "tag"}, "New")] : []),
                  ...(slowed ? [el("span", {class: "flag"}, icon("slowed", 12, 2.8))] : []),
                  el("span", {class: "n num"}, set.reps === null ? "?" : String(set.reps)),
                  el("span", {class: "k"}, set.weight ? pounds(set.weight) : "Set " + (i + 1)));
      })));
    if (exercise.suggestion) {
      const tone = {more: "good", less: "effort"}[exercise.suggestion.kind] || "";
      const sign = {more: "more", less: "less"}[exercise.suggestion.kind] || "stay";
      card.append(callout(tone, sign, exercise.suggestion.text));
    } else if (!exercise.exercise) {
      card.append(callout("", "info", "Tap a set to pick its exercise."));
    }
    return card;
  });
  if (anySlowed) {
    cards.push(el("div", {class: "foot", "data-rise": ""}, icon("slowed", 16),
      el("span", {}, "Marked sets slowed a lot on the last rep. Tap any set to see its pace.")));
  }
  const parts = [hero, el("div", {class: "list b"}, ...cards)];
  if (workouts.length > 1) {
    parts.push(el("section", {class: "stack c", "data-rise": "", style: "gap:8px"},
      el("h2", {class: "eyebrow", style: "padding:8px 4px 0"}, "Other workouts"),
      el("div", {class: "card rows"}, ...workouts.map((other, index) => index === shown ? "" :
        el("button", {class: "rowlink", onclick: () => { shown = index; draw(true); window.scrollTo(0, 0); }},
           el("span", {}, workoutTitle(other),
              el("span", {class: "sub"}, plural(other.reps, "rep") + " · " + plural(other.sets, "set"))),
           icon("right", 18))))));
  }
  view.replaceChildren(el("div", {class: "cols today"}, ...parts));
  return {node: big.number, value: workout.reps};
}

function paceCard(set) {
  // Seconds from one rep to the next. The server sends the gaps; fewer than two say nothing.
  const gaps = set.gaps || [];
  if (gaps.length < 2 || set.slowdown_pct === null) return null;
  const fastest = Math.min(...gaps), slowest = Math.max(...gaps);
  const top = Math.max(slowest, set.usual_s);            // the tallest thing in the chart: 100% of its height
  const crowded = gaps.length > 10;                      // many reps: label only what matters so numbers don't collide
  const tones = new Set();
  const cols = gaps.map((gap, i) => {
    const ratio = gap / set.usual_s;                     // against the set's usual pace, as the server judges it
    const tone = ratio >= 1.25 ? "slower" : ratio >= 1.1 ? "slow" : "";
    tones.add(tone);
    const last = i === gaps.length - 1;
    const height = Math.max(3, Math.round(1000 * gap / top) / 10);
    return el("div", {class: "col" + (last ? " last" : ""), style: "--c:" + Math.min(i, 12)},
      ...(crowded && !last ? [] : [el("span", {class: "val", style: "bottom:" + height + "%"}, el("span", {}, gap.toFixed(1)))]),
      el("div", {class: "bar" + (tone ? " " + tone : ""), style: "height:" + height + "%"}));
  });
  const names = gaps.map((gap, i) => {
    const last = i === gaps.length - 1;
    const text = gaps.length <= 8 ? (i + 1) + "–" + (i + 2) : (crowded && i % 2 && !last ? "" : String(i + 2));
    return el("span", last ? {class: "last"} : {}, text);
  });
  const sentence = set.slowdown_pct >= 10
    ? callout("effort", "slowed", "The last rep took " + set.slowdown_pct + "% longer than your usual pace.")
    : callout("good", "ok", "Steady pace all the way through.");
  return el("section", {class: "card", "data-rise": ""},
    el("div", {class: "card-head"}, el("h2", {}, "Pace"), el("span", {class: "muted"}, "Seconds from one rep to the next")),
    el("div", {class: "chart", role: "img",
               "aria-label": "Rep pace: fastest " + fastest.toFixed(1) + " seconds, slowest " + slowest.toFixed(1)
                           + " seconds, usual " + set.usual_s.toFixed(1) + " seconds, last " + gaps[gaps.length - 1].toFixed(1) + " seconds"},
      el("div", {class: "plot"}, ...cols,
         el("div", {class: "ref", style: "bottom:" + Math.round(1000 * set.usual_s / top) / 10 + "%"})),
      el("div", {class: "axis"}, ...names),
      el("div", {class: "legend"},
        el("span", {}, el("i", {class: "dash"}), "Usual pace " + set.usual_s.toFixed(1) + " s"),
        ...(tones.has("slow") ? [el("span", {}, el("i", {class: "slow"}), "10% or more slower")] : []),
        ...(tones.has("slower") ? [el("span", {}, el("i", {class: "slower"}), "25% or more slower")] : []))),
    sentence);
}

function traceKey(set) {
  // The line changes when the exercise does (a different exercise is counted on a different signal).
  return [set.set_id, set.exercise, set.counted].join("|");
}

function traceCard(set) {
  // What the watch felt: one line for the whole set, and a numbered mark where it counted each rep.
  if (!trace || trace.key !== traceKey(set) || !trace.points || trace.points.length < 2) return null;
  const points = trace.points, reps = trace.reps || [];
  const end = points[points.length - 1][0] || 1;
  let low = Infinity, high = -Infinity;
  for (const [, g] of points) { low = Math.min(low, g); high = Math.max(high, g); }
  const room = (high - low || 1) * 0.12;                 // air above and below, so marks at the top aren't cut off
  low -= room; high += room;
  const x = t => 100 * t / end, y = g => 100 * (g - low) / (high - low);
  const path = points.map(([t, g], i) => (i ? "L" : "M") + x(t).toFixed(2) + " " + (100 - y(g)).toFixed(2)).join("");
  const valueAt = t => {                                 // the line's height at a moment between two of its points
    let i = points.findIndex(point => point[0] >= t);
    if (i <= 0) return points[i === 0 ? 0 : points.length - 1][1];
    const [t0, g0] = points[i - 1], [t1, g1] = points[i];
    return g0 + (g1 - g0) * (t1 === t0 ? 0 : (t - t0) / (t1 - t0));
  };
  const small = reps.length > 14;                        // many reps: plain marks, the numbers would collide
  // Pull-ups and push-ups are counted on how far the wrist turns, because the hand itself stays put.
  const what = trace.unit === "degrees" ? "The line is your wrist turning as your body moves." : "The line is your wrist moving.";
  return el("section", {class: "card", "data-rise": ""},
    el("div", {class: "card-head"}, el("h2", {}, "Movement"), el("span", {class: "muted"}, "What the watch felt")),
    el("div", {class: "chart", role: "img",
               "aria-label": "Your wrist's movement over " + Math.round(end) + " seconds, with " + plural(reps.length, "rep") + " marked"},
      el("div", {class: "trace"},
        svgEl("svg", {viewBox: "0 0 100 100", preserveAspectRatio: "none", "aria-hidden": "true"},
          svgEl("path", {class: "area", d: path + "L100 100L0 100Z"}),
          svgEl("path", {class: "line", d: path})),
        ...reps.map((t, i) => el("span", {class: "rep-dot" + (small ? " small" : ""),
                                          style: "--c:" + Math.min(i, 14) + ";left:" + x(t).toFixed(2) + "%;bottom:" + y(valueAt(t)).toFixed(2) + "%"},
                                 small ? "" : String(i + 1)))),
      el("div", {class: "ends"}, el("span", {}, "0 s"), el("span", {}, Math.round(end) + " s"))),
    el("div", {class: "note"}, what + (reps.length ? " Each mark is a rep the counter found." : " The counter found no reps in it.")));
}

function labelOf(name) {
  const match = exercises.find(e => e.name === name);
  return match ? match.label : (name || "No exercise picked");
}

function drawSet() {
  const set = openSet;
  const note = el("div", {class: "note", "aria-live": "polite"}, "Wrong exercise? Change it and the reps are counted again.");
  const select = el("select", {id: "exercise", onchange: async () => {
    note.className = "note"; note.textContent = "Counting again…";
    try {
      const response = await fetch("/sets/" + set.set_id + "/exercise", {
        method: "PUT", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({exercise: select.value})});
      if (!response.ok) throw new Error(response.status);
      openSet = await response.json();
      await refresh();
      draw(true);
    } catch (error) {
      note.className = "note effort"; note.textContent = "Couldn't change it. Check the connection and try again.";
      select.value = set.exercise || "";
    }
  }});
  if (!set.exercise) select.append(el("option", {value: ""}, "Pick one"));
  for (const e of exercises) select.append(el("option", {value: e.name}, e.label));
  select.value = set.exercise || "";

  // One helper for every change on this screen: send it, show the answer, and say so if it didn't work.
  const send = async (method, path, body, problemNote) => {
    try {
      openSet = await change(method, path, body);
      await refresh();
      draw(true);
      return true;
    } catch (error) {
      problemNote.className = "note effort"; problemNote.textContent = "Couldn't save that. Check the connection and try again.";
      return false;
    }
  };
  const here = "/sets/" + set.set_id;

  // The count. The counter can be wrong; the wearer has the last word, and the counter's number is kept beside theirs.
  const corrected = set.reps_fixed !== null && set.reps_fixed !== undefined;
  const repsNote = el("div", {class: "note", "aria-live": "polite"},
    corrected ? "You changed this. The counter found " + (set.counted === null ? "none" : set.counted) + "."
              : "Not right? Set it to what you did.");
  const count = set.reps === null ? 0 : set.reps;
  const repsCard = el("section", {class: "card", "data-rise": ""},
    el("div", {class: "field"}, el("span", {class: "lab", id: "reps-label"}, "Reps"),
      el("div", {class: "stepper", role: "group", "aria-labelledby": "reps-label"},
        el("button", {"aria-label": "One fewer rep", onclick: () => { if (count > 0) send("PUT", here + "/reps", {reps: count - 1}, repsNote); }}, "−"),
        el("span", {class: "now num", "aria-live": "polite"}, String(count)),
        el("button", {"aria-label": "One more rep", onclick: () => send("PUT", here + "/reps", {reps: count + 1}, repsNote)}, "+"))),
    repsNote,
    ...(corrected ? [el("button", {class: "linkbtn", onclick: () => send("PUT", here + "/reps", {reps: null}, repsNote)}, "Use the counter's number")] : []));

  // The weight. Typed once; the next set of the same exercise is offered the same number with one tap.
  const weightNote = el("div", {class: "note", "aria-live": "polite"},
    set.weight ? "Suggestions for this exercise now name a weight." : "Add it and suggestions can name a number.");
  const weightInput = el("input", {id: "weight", type: "number", inputmode: "decimal", min: "0.5", max: "1000", step: "0.5",
                                   placeholder: "0", value: set.weight ? String(set.weight) : ""});
  const saveWeight = () => {
    const typed = weightInput.value.trim();
    const value = typed === "" ? null : Number(typed);
    if (value === (set.weight || null)) return;
    if (value !== null && !(value > 0 && value <= 1000)) {
      weightNote.className = "note effort"; weightNote.textContent = "Enter a weight between 0.5 and 1000 lb."; return;
    }
    send("PUT", here + "/weight", {weight: value}, weightNote);
  };
  weightInput.addEventListener("change", saveWeight);
  weightInput.addEventListener("keydown", event => { if (event.key === "Enter") weightInput.blur(); });
  const weightCard = el("section", {class: "card", "data-rise": ""},
    el("div", {class: "field"}, el("label", {for: "weight"}, "Weight"), el("div", {class: "weight"}, weightInput, el("span", {class: "muted"}, "lb"))),
    weightNote,
    ...(!set.weight && set.last_weight ? [el("button", {class: "offer", onclick: () => send("PUT", here + "/weight", {weight: set.last_weight}, weightNote)},
                                             "Same as last time: " + pounds(set.last_weight))] : []));

  // Removing. Nothing is deleted on the server, so it can be undone, and that is why there is no "are you sure?".
  const removeNote = el("div", {class: "note", "aria-live": "polite"});
  const restore = async () => {
    try { await change("POST", here + "/restore"); await refresh(); draw(true); toast("Set put back"); }
    catch (error) { toast("Couldn't put it back. Try again."); }
  };
  const removeButton = el("button", {class: "danger", "data-rise": "", onclick: async () => {
    try {
      await change("DELETE", here);
      location.hash = "";
      toast("Set removed", "Undo", restore);
    } catch (error) {
      removeNote.className = "note effort"; removeNote.textContent = "Couldn't remove it. Check the connection and try again.";
    }
  }}, "Remove this set");

  const pace = paceCard(set);
  const movement = traceCard(set);
  const gaps = set.gaps || [];
  // When the set happened; for one recorded before the watch knew the time, when it was uploaded.
  const when = set.started_at ? new Date(set.started_at * 1000) : new Date(set.received_at.replace(" ", "T") + "Z");
  const big = bigNumber(set.reps, set.reps === 1 ? "rep" : "reps");
  const hero = el("section", {class: "card hero", "data-rise": ""},
    el("div", {class: "eyebrow"}, labelOf(set.exercise)),
    big.node,
    el("div", {class: "stats"},
      stat((set.duration_ms / 1000).toFixed(1), "s", "Length"),
      ...(pace ? [stat(set.usual_s.toFixed(1), "s", "Usual pace"), stat(gaps[gaps.length - 1].toFixed(1), "s", "Last rep")] : [])));
  view.replaceChildren(
    el("button", {class: "back", "aria-label": "Back to the workout", onclick: () => { location.hash = ""; }}, icon("left", 22), "Back"),
    el("div", {class: "cols set"},
      el("div", {class: "stack"},
        hero,
        ...(set.removed_at ? [el("div", {class: "stack", "data-rise": "", style: "gap:8px"},
            callout("effort", "info", "This set was removed. It isn't counted in your workouts."),
            el("button", {class: "offer", onclick: restore}, "Put it back"))] : []),
        ...(set.counted === null && !corrected ? [el("div", {"data-rise": ""}, callout("effort", "warn", "This set couldn't be counted. Its recording is saved. You can set the reps yourself."))] : []),
        ...(set.counted === 0 && !corrected && !set.removed_at ? [el("div", {"data-rise": ""}, callout("", "info", "No reps were found in this recording. If it was a test press, remove the set. If not, set the reps yourself."))] : []),
        ...(corrected && pace && set.counted !== set.reps ? [el("div", {"data-rise": ""}, callout("", "info", "The pace below is from the " + plural(set.counted, "rep") + " the counter found."))] : []),
        ...(movement ? [movement] : []),
        ...(pace ? [pace] : [])),
      el("div", {class: "stack"},
        repsCard,
        weightCard,
        el("section", {class: "card", "data-rise": ""},
          el("div", {class: "field"}, el("label", {for: "exercise"}, "Exercise"), el("div", {class: "pick"}, select, icon("down", 18))),
          note),
        el("section", {class: "card rows", "data-rise": "", "aria-label": "About this set"},
          el("div", {class: "kv"}, el("span", {}, set.started_at ? "Started" : "Uploaded"),
            el("span", {}, clockTime(when), el("span", {class: "sub"}, ago(when)))),
          el("div", {class: "kv"}, el("span", {}, "Set number"), el("span", {class: "num"}, set.set_id.slice(0, 5)))),
        ...(set.removed_at ? [] : [removeButton, removeNote]))));
  return {node: big.number, value: set.reps};
}

function shortDay(iso) {
  return new Date(iso).toLocaleDateString(undefined, {month: "short", day: "numeric"});
}

function activityCard() {
  // The last four weeks, Monday to Sunday, newest week at the bottom. A day with a workout is filled,
  // brighter for a bigger day, and opens that workout. Worked out here from the workouts already loaded.
  const midnight = date => new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const today = midnight(new Date());
  const monday = new Date(today); monday.setDate(today.getDate() - (today.getDay() + 6) % 7);
  const first = new Date(monday); first.setDate(monday.getDate() - 21);
  const byDay = new Map();          // day -> {reps, sets, count, index of that day's newest workout}
  workouts.forEach((workout, index) => {
    const key = midnight(new Date(workout.started_at)).getTime();
    const day = byDay.get(key) || {reps: 0, sets: 0, count: 0, index};
    day.reps += workout.reps; day.sets += workout.sets; day.count += 1;
    byDay.set(key, day);           // workouts are newest first, so the first one seen for a day is its newest
  });
  const most = Math.max(1, ...[...byDay.values()].map(day => day.reps));
  let thisWeek = 0, fourWeeks = 0, shownOn = 0;
  const cells = [];
  for (let i = 0; i < 28; i++) {
    const date = new Date(first); date.setDate(first.getDate() + i);
    const day = byDay.get(date.getTime());
    const isToday = date.getTime() === today.getTime(), later = date > today;
    const spoken = date.toLocaleDateString(undefined, {weekday: "long", month: "short", day: "numeric"});
    if (day) {
      fourWeeks += day.count;
      if (date >= monday) thisWeek += day.count;
      cells.push(el("button", {class: "day on" + (day.reps >= 0.6 * most ? " big" : "") + (isToday ? " today" : ""), style: "--c:" + Math.min(shownOn++, 10),
                               "aria-label": spoken + ": " + plural(day.reps, "rep") + ", " + plural(day.sets, "set") + ". Open this workout.",
                               onclick: () => { shown = day.index; location.hash = ""; window.scrollTo(0, 0); }},
                    String(date.getDate())));
    } else {
      cells.push(el("div", {class: "day" + (isToday ? " today" : "") + (later ? " later" : ""),
                            role: "img", "aria-label": spoken + (later ? "" : ": no workout")}, String(date.getDate())));
    }
  }
  return el("section", {class: "card", "data-rise": ""},
    el("div", {class: "card-head"}, el("h2", {}, "Last 4 weeks"), el("span", {class: "muted"}, plural(fourWeeks, "workout"))),
    el("div", {class: "cal"},
      el("div", {class: "weeks"},
        ...["M", "T", "W", "T", "F", "S", "S"].map(letter => el("span", {class: "wd", "aria-hidden": "true"}, letter)),
        ...cells),
      el("div", {class: "words"},
        el("span", {class: "n num"}, String(thisWeek), el("small", {}, thisWeek === 1 ? "workout this week" : "workouts this week")),
        el("span", {class: "muted"}, "Tap a filled day to open its workout."))));
}

function drawProgress() {
  // One card per exercise: total reps in each workout, oldest on the left, the newest emphasised.
  if (!progress.length) {
    view.replaceChildren(el("div", {class: "empty", "data-rise": ""},
      buddy("ok", 132),
      el("h2", {}, "No progress yet"),
      el("p", {}, "Each exercise gets a chart here once you have recorded it."),
      steps("Pick an exercise on your watch", "Record a few sets", "Come back after your next workout")));
    return;
  }
  const cards = progress.map(exercise => {
    const all = exercise.workouts, shownOnes = all.slice(-8), latest = all[all.length - 1];
    const top = Math.max(1, ...shownOnes.map(w => w.reps));
    const cols = shownOnes.map((w, i) => {
      const last = i === shownOnes.length - 1;
      const height = Math.max(3, Math.round(1000 * w.reps / top) / 10);
      return el("div", {class: "col" + (last ? " last" : ""), style: "--c:" + i},
        el("span", {class: "val", style: "bottom:" + height + "%"}, el("span", {}, String(w.reps))),
        el("div", {class: "bar" + (last ? "" : " past"), style: "height:" + height + "%"}));
    });
    const delta = exercise.change === null ? null : changeChip(exercise.change, "last time");
    const facts = [plural(latest.sets, "set"), "best set " + latest.best];
    if (latest.weight) facts.push(pounds(latest.weight));
    return el("section", {class: "card", "data-rise": ""},
      el("div", {class: "card-head"}, el("h2", {}, exercise.label),
        el("span", {class: "muted"}, plural(all.length, "workout"))),
      el("div", {class: "trend-top"},
        el("span", {class: "n num"}, String(latest.reps), el("small", {}, latest.reps === 1 ? "rep" : "reps")),
        ...(delta ? [delta] : [])),
      el("div", {class: "muted"}, "Latest: " + facts.join(" · ")),
      ...(all.length > 1 ? [el("div", {class: "chart", role: "img",
            "aria-label": "Total reps per workout, oldest first: " + shownOnes.map(w => shortDay(w.started_at) + " " + w.reps).join(", ")},
          el("div", {class: "plot small"}, ...cols),
          el("div", {class: "axis"}, ...shownOnes.map((w, i) => el("span", i === shownOnes.length - 1 ? {class: "last"} : {}, shortDay(w.started_at)))))]
        : [callout("", "info", "One workout so far. The trend starts with the next one.")]));
  });
  view.replaceChildren(el("div", {class: "stack"},
    el("div", {"data-rise": ""}, el("h2", {style: "font-size:24px;font-weight:700;letter-spacing:-0.02em"}, "Progress"),
      el("div", {class: "muted"}, "How often you train, and total reps per workout for each exercise.")),
    activityCard(),
    el("div", {class: "list b"}, ...cards)));
}

function drawWatch() {
  if (!health.seen) {
    view.replaceChildren(el("div", {class: "empty", "data-rise": ""},
      buddy("warn", 132),
      el("h2", {}, "No word from the watch yet"),
      el("p", {}, "It reports how it is doing after every sync."),
      steps("Bring the watch near your Wi-Fi", "Hold B to sync", "Seven checks show up here")));
    return;
  }
  const words = {ok: "Passed", warn: "Check", fail: "Failed"};
  const passed = health.checks.filter(c => c.status === "ok").length;
  view.replaceChildren(el("div", {class: "cols watch"},
    el("section", {class: "card buddy-card", "data-rise": ""},
      buddy(health.status, 112),
      el("div", {class: "words"},
        el("h2", {class: "title"}, health.summary),
        el("div", {class: "muted"}, passed + " of " + health.checks.length + " checks passed"),
        el("div", {class: "meter", "aria-hidden": "true"}, ...health.checks.map((check, i) =>
          el("i", {class: check.status, style: "--c:" + i}))))),
    el("div", {class: "stack"},
      el("section", {class: "card rows", "data-rise": "", "aria-label": "Checks"}, ...health.checks.map(check =>
        el("div", {class: "check"},
          el("span", {class: "mark " + check.status, role: "img", "aria-label": words[check.status]}, icon(check.status, 15, 3)),
          el("div", {class: "body"},
            el("div", {}, check.label),
            ...(check.help ? [el("div", {class: "help " + check.status}, check.help)] : [])),
          el("div", {class: "value"}, check.value)))),
      el("div", {class: "foot", "data-rise": ""}, icon("info", 16),
        el("span", {}, "The watch sends these numbers after every sync. The limits are set on the server.")),
      locked
        ? el("button", {class: "linkbtn", "data-rise": "", style: "padding:0 4px", onclick: async () => {
            try { await change("POST", "/logout"); } catch (error) { /* signing out of a server that is down: nothing to do */ }
            location.replace("/login");
          }}, "Sign out")
        : el("div", {class: "foot", "data-rise": ""}, icon("info", 16),
            el("span", {}, "This server has no password: anyone on the same Wi-Fi can open this page.")))));
}

function draw(force) {
  drawStatus();
  const where = route();
  const fresh = [...arrived.keys()].filter(isNew);       // so the "New" mark is drawn when it appears and cleared when it runs out
  const fingerprint = JSON.stringify([workouts, health, openSet, where, shown, serverDown, loaded, progress, fresh, trace && trace.key]);
  if (!force && fingerprint === lastDrawn) return;      // nothing new: leave the screen alone
  lastDrawn = fingerprint;

  // "ready" means the server has sent what this screen needs. Until then: grey shapes, or the offline screen.
  const ready = where.screen === "set" ? Boolean(openSet) : where.screen === "watch" ? Boolean(health) : loaded;
  const scene = [where.screen, where.id || "", shown, ready, serverDown && !ready].join("|");
  const entering = scene !== lastScene;                 // a different screen than last time: let it ease in
  lastScene = scene;
  view.classList.toggle("enter", entering);
  view.setAttribute("aria-busy", String(!ready && !serverDown));

  let hero = null;
  if (!ready && serverDown) drawOffline();
  else if (!ready) view.replaceChildren(...skeleton(where.screen));
  else if (where.screen === "watch") drawWatch();
  else if (where.screen === "progress") drawProgress();
  else if (where.screen === "set") hero = drawSet();
  else hero = drawToday();

  // Hand out the order in which the pieces ease in: 0, 1, 2 ... Each one starts a moment after the one before.
  if (entering) view.querySelectorAll("[data-rise]").forEach((node, i) => node.style.setProperty("--i", Math.min(i, 8)));
  if (hero && hero.value !== null) {
    if (entering) countUp(hero.node, 0, hero.value);
    else if (heroWas !== null && heroWas !== hero.value) countUp(hero.node, heroWas, hero.value);
  }
  heroWas = hero ? hero.value : null;
}

async function getJson(path) {
  const response = await fetch(path);
  if (response.status === 401) location.replace("/login");      // signed out, or the password changed
  if (!response.ok) throw new Error(path + " " + response.status);
  return response.json();
}

function noticeNewSets() {
  // Which sets weren't here a moment ago? Those just came from the watch: mark them, say so, and show their workout.
  const ids = workouts.flatMap(w => w.exercises.flatMap(e => e.sets.map(s => s.set_id)));
  if (knownSets === null) { knownSets = new Set(ids); return; }        // opening the page: nothing is new
  const news = ids.filter(id => !knownSets.has(id));
  if (!news.length) return;
  for (const id of news) { knownSets.add(id); arrived.set(id, Date.now()); }
  shown = 0;
  let reps = 0, label = "";
  for (const w of workouts) for (const e of w.exercises) for (const s of e.sets)
    if (news.includes(s.set_id)) { reps += s.reps || 0; label = e.label; }
  toast(news.length === 1 ? "New set: " + label + ", " + plural(reps, "rep")
                          : plural(news.length, "new set") + ", " + plural(reps, "rep"));
}

async function refresh() {
  try {
    const where = route();
    const [newWorkouts, newHealth, newProgress, newSet, newExercises] = await Promise.all([
      getJson("/workouts"), getJson("/watch/health"), getJson("/progress"),
      where.screen === "set" ? getJson("/sets/" + encodeURIComponent(where.id)).catch(() => null) : null,
      exercises.length ? exercises : getJson("/exercises")]);
    workouts = newWorkouts; health = newHealth; exercises = newExercises; progress = newProgress;
    noticeNewSets();
    loaded = true;
    if (where.screen === "set") {
      if (newSet === null) { location.hash = ""; return; }      // a set that doesn't exist: back to Today
      openSet = newSet;
      const key = traceKey(newSet);
      if (!trace || trace.key !== key) {
        // A set with no recording to draw simply has no Movement card.
        const drawn = await getJson("/sets/" + encodeURIComponent(where.id) + "/trace").catch(() => ({}));
        trace = {key, points: drawn.points, reps: drawn.reps, unit: drawn.unit};
      }
    }
    serverDown = false;
  } catch (error) {
    serverDown = true;                                  // keep showing what we have
  }
  draw(false);
}

document.getElementById("nav-today").addEventListener("click", () => {
  shown = 0;
  if (location.hash) location.hash = ""; else { draw(true); window.scrollTo(0, 0); }   // already on Today: just show the newest workout
});
document.getElementById("nav-watch").addEventListener("click", () => { location.hash = "watch"; });
document.getElementById("nav-progress").addEventListener("click", () => { location.hash = "progress"; });
statusEl.addEventListener("click", () => { location.hash = "watch"; });
window.addEventListener("hashchange", () => { openSet = null; draw(true); refresh(); window.scrollTo(0, 0); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
// Not while a dropdown is open or a number is being typed: a redraw would take it out of the person's hands.
setInterval(() => { if (!document.hidden && !["SELECT", "INPUT"].includes(document.activeElement.tagName)) refresh(); }, REFRESH_MS);
draw(true);                                             // grey shapes straight away, then the real thing
fetch("/session").then(r => r.ok ? r.json() : null).then(s => { if (s && !s.password) { locked = false; draw(true); } }).catch(() => {});
refresh();
</script>
