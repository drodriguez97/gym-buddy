<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F4F6" media="(prefers-color-scheme: light)">
<title>Sign in · Gym Buddy</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='8'/%3E%3Crect x='5.5' y='8' width='7' height='9' rx='3' fill='%237CFF6B'/%3E%3Crect x='15.5' y='8' width='7' height='9' rx='3' fill='%237CFF6B'/%3E%3Cpath d='M11 20.5q3 2.2 6 0' stroke='%237CFF6B' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<!-- "Add to Home Screen" on a phone: its own icon, and it opens full screen like an app, without the browser's bars. -->
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Buddy">
<style>
  /* The sign-in screen. Same colours and shapes as the dashboard, kept in this
     one file so it loads even before you are allowed to load anything else. */
  :root {
    --bg: #0B0B0C; --card: #1A1A1D; --field: #26262A; --line: #2E2E33;
    --text: #F5F5F7; --muted: #A0A0A8; --good: #7CFF6B; --on-good: #0B0B0C;
    --trouble: #FFB48A; --face: #050506;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #F4F4F6; --card: #FFFFFF; --field: #EDEDF0; --line: #DDDDE2;
            --text: #111114; --muted: #5C5C66; --good: #1E8E3E; --on-good: #FFFFFF;
            --trouble: #B3470F; color-scheme: light; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: grid; place-items: center;
         padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)); }
  main { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line);
         border-radius: 24px; padding: 32px 24px 24px; display: flex; flex-direction: column;
         align-items: center; gap: 6px; text-align: center; }
  .watch { width: 96px; height: 64px; border-radius: 16px; background: var(--face);
           display: grid; place-items: center; margin-bottom: 14px; }
  .eye { fill: #7CFF6B; transform-origin: center; transform-box: fill-box; animation: blink 5s infinite; }
  @keyframes blink { 0%, 46%, 50%, 100% { transform: scaleY(1); } 48% { transform: scaleY(0.1); } }
  .shake { animation: shake 0.35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  h1 { font-size: 24px; font-weight: 650; margin: 0; letter-spacing: -0.2px; }
  p { margin: 0; color: var(--muted); font-size: 15px; }
  form { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: 22px; text-align: left; }
  label { font-size: 14px; color: var(--muted); }
  input { font: inherit; color: var(--text); background: var(--field); border: 1px solid transparent;
          border-radius: 14px; min-height: 52px; padding: 0 16px; width: 100%; }
  input:focus-visible { outline: none; border-color: var(--good); }
  button { font: inherit; font-weight: 650; color: var(--on-good); background: var(--good); border: 0;
           border-radius: 14px; min-height: 52px; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  button[disabled] { opacity: 0.6; cursor: default; }
  .problem { color: var(--trouble); font-size: 14px; min-height: 20px; }
  @media (prefers-reduced-motion: reduce) { .eye, .shake { animation: none; } }
</style>
</head>
<body>
<main id="card">
  <div class="watch" aria-hidden="true">
    <svg viewBox="0 0 64 36" width="64" height="36">
      <rect class="eye" x="8" y="4" width="18" height="20" rx="7"/>
      <rect class="eye" x="38" y="4" width="18" height="20" rx="7"/>
      <path d="M24 29 Q32 35 40 29" stroke="#7CFF6B" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
  </div>
  <h1>Gym Buddy</h1>
  <p>Sign in to see your workouts.</p>
  <form id="form">
    <label for="password">Password</label>
    <!-- The hidden user name lets a password manager save and fill this properly. -->
    <input type="text" name="username" value="gym-buddy" autocomplete="username" hidden>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <div class="problem" id="problem" role="alert"></div>
    <button id="go" type="submit">Sign in</button>
  </form>
</main>
<script>
// Sends the password to the server once. If it is right, the server answers
// with a cookie the browser keeps for 30 days, and this page moves on to the dashboard.
const form = document.getElementById("form");
const field = document.getElementById("password");
const problem = document.getElementById("problem");
const go = document.getElementById("go");
const card = document.getElementById("card");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  go.disabled = true; go.textContent = "Signing in…"; problem.textContent = "";
  let message = "";
  try {
    const response = await fetch("/login", {method: "POST", headers: {"Content-Type": "application/json"},
                                            body: JSON.stringify({password: field.value})});
    if (response.ok) { location.replace("/"); return; }
    message = response.status === 401 ? "That password isn't right. Try again." : "Something went wrong. Try again.";
  } catch (error) {
    message = "Can't reach the server. Check your connection.";
  }
  problem.textContent = message;
  go.disabled = false; go.textContent = "Sign in";
  card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  field.select();
});
</script>
</body>
</html>
